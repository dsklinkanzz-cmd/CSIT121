    <main>
        <h1>Contact Form</h1>
        <p>Fill out the form below to submit your own class rankings for World of Warcraft Forever:</p>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="Class">Favorite Class:</label>
            <textarea id="Class" name="Class" rows="2" cols="10" required></textarea>
            <label for="ranking">Your Class Ranking:</label>
            <textarea id="ranking" name="Ranking" rows="2" cols="2" required></textarea>
            <br>
            <label for="class">Preferred playstyle:</label>
            <select id="class" name="class" required>
                <option value="tank">Tank</option>
                <option value="healer">Healer</option>
                <option value="damage dealer">Damage Dealer</option>
            </select>
            <br>
            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments" rows="3" cols="30"></textarea>
            <br>
            <input type="submit" value="Submit">
        </form>
    </main>
